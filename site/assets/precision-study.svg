<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" fill="none">
 <title>Parametric bracket architecture concept</title>
 <desc>A technical illustration of a precision bracket, with exact-solid geometry, a mesh-display outline, construction references, and a proposed feature sequence. This is a concept, not a software screenshot.</desc>
 <defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" stroke="#65745d" stroke-opacity=".12" stroke-width=".6"/></pattern>
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx=".5" cy=".5" r="1" fill="#819575" fill-opacity=".22"/></pattern>
  <linearGradient id="base" x1="300" y1="400" x2="550" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#ffcb7c"/><stop offset="1" stop-color="#ef9c37"/></linearGradient>
  <linearGradient id="wall" x1="265" y1="320" x2="450" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#ec9d3c"/><stop offset="1" stop-color="#ffc56c"/></linearGradient>
  <linearGradient id="edge" x1="200" y1="300" x2="460" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#d5872c"/><stop offset="1" stop-color="#8b551f"/></linearGradient>
  <linearGradient id="bore" x1="333" y1="270" x2="367" y2="377" gradientUnits="userSpaceOnUse"><stop stop-color="#3d301d"/><stop offset=".65" stop-color="#714c25"/><stop offset="1" stop-color="#e0a252"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#586b3d" stop-opacity=".13"/><stop offset="1" stop-color="#586b3d" stop-opacity="0"/></radialGradient>
 </defs>
