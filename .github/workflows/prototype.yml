name: CAD prototype checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-core.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_addon.py --output work/b-cad-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: b-cad-experimental-addon
          path: work/b-cad-experimental.zip
