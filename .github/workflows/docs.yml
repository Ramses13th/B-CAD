name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_docs.py
      - run: python tools/build_site.py --output work/site
      - run: python tools/check_docs.py --site work/site

